<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Comic Reader</title>
        <link rel="stylesheet" href="/src/styles.css" />
        <script type="module" src="/src/main.ts"></script>
    </head>
    <body>
        <main id="scroller" tabindex="-1">
            <div id="empty">
                <div class="empty-glyph" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5" /><path d="M5 10h14M12 10v11" /></svg>
                </div>
                <h1>Drop a comic to start reading</h1>
                <p class="empty-note">CBZ, CBR, ZIP, RAR or TAR.GZ archive, or a folder of images</p>
                <div class="empty-actions">
                    <button class="primary" data-open="file">Open Comic…</button>
                    <button data-open="folder">Open Folder…</button>
                </div>
                <p class="empty-note">
                    <kbd id="key-open-file"></kbd> open comic
                    <kbd id="key-open-folder"></kbd> open folder
                </p>
            </div>
            <div id="pages"></div>
            <section id="end" aria-label="End of comic">
                <span class="end-check" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" /></svg>
                </span>
                <h2 id="end-title"></h2>
                <p id="end-detail"></p>
                <button id="read-again">Read again</button>
            </section>
        </main>

        <footer id="toolbar">
            <!-- <button id="open-file">Open File</button> -->
            <!-- <button id="open-folder">Open Folder</button> -->
            <span class="spacer"></span>
            <span id="counter"></span>
            <span class="spacer"></span>
            <button id="zoom-out" title="Zoom out">-</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" title="Zoom in">+</button>
            <!-- <button id="fullscreen" title="Full screen">Full Screen</button> -->
        </footer>
        <div id="counter-overlay"></div>
        <div id="status" hidden></div>
        <div id="toast" hidden>
            <span class="toast-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z" /></svg>
            </span>
            <span class="toast-body">
                <span id="toast-text"></span>
                <small>You stopped here last time</small>
            </span>
            <button id="toast-action">Start over</button>
            <span class="toast-timer"></span>
        </div>
        <div id="drop-highlight" hidden>Drop to open</div>
    </body>
</html>
