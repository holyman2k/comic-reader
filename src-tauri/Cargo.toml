[package]
name = "comic-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "comic_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "8.6"
unrar = "0.5.8"
tar = "0.4.46"
flate2 = "1.1"
imagesize = "0.15"
tempfile = "3.27"
